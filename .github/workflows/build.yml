name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.2'
            fabric_api: '0.161.0+26.2'
          - minecraft: '26.3'
            fabric_api: '0.165.0+26.3'
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify
        run: |
          set -euo pipefail
          chmod +x build.sh scripts/verify-jar.sh scripts/build-modpack.sh scripts/verify-modpack.sh
          ./build.sh \
            -Pminecraft_version=${{ matrix.minecraft }} \
            -Pfabric_api_version=${{ matrix.fabric_api }}
          bash scripts/verify-jar.sh ${{ matrix.minecraft }}

      - name: Build and verify the launcher modpacks
        run: |
          set -euo pipefail
          bash scripts/build-modpack.sh \
            --minecraft ${{ matrix.minecraft }} \
            --fabric-api ${{ matrix.fabric_api }}
          bash scripts/verify-modpack.sh dist/*.mrpack dist/*-curseforge.zip

      - name: Upload the mod jar and modpacks
        uses: actions/upload-artifact@v4
        with:
          name: xray-${{ matrix.minecraft }}
          path: |
            build/libs/xray-*.jar
            !build/libs/*-sources.jar
            dist/*.mrpack
            dist/*-curseforge.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
