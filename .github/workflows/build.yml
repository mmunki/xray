name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify
        run: |
          set -euo pipefail
          chmod +x build.sh scripts/verify-jar.sh
          ./build.sh
          bash scripts/verify-jar.sh

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: xray
          path: |
            build/libs/xray-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
