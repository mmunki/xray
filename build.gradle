plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// The file name carries the Minecraft version, exactly like a CurseForge
// file: xray-<mod version>+<minecraft version>.jar.
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

// The dependency range is derived from the version that is being built, so a
// single source tree can produce a jar for each supported Minecraft release.
def minecraftBase = project.minecraft_version.split('-')[0]
def minecraftParts = minecraftBase.tokenize('.')
def minecraftRange = ">=${project.minecraft_version} <${minecraftParts[0]}.${(minecraftParts[1] as int) + 1}"

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.mod_version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version,
               "minecraft_version": project.minecraft_version,
               "minecraft_version_range": minecraftRange
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    manifest {
        attributes(
                "Implementation-Title": "X-Ray",
                "Implementation-Version": project.mod_version,
                "Implementation-Vendor": "mmunki",
                "Specification-Title": "X-Ray",
                "Specification-Version": project.mod_version,
                "Specification-Vendor": "mmunki")
    }
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
